[project]
name = "kalshi-trading-bot"
version = "2.0.0"
description = "Kalshi trading bot with Octagon research, modular architecture, and risk management"
authors = [
    {name = "Octagon", email = "support@octagon.ai"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "websockets>=11.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "cryptography>=41.0.0",
    "openai>=1.0.0",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
]
dashboard = [
    "plotly>=5.0.0",
]

[project.scripts]
trading-bot = "trading_bot:cli"
arb-scanner = "arbitrage_scanner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "trading_bot.py",
    "config.py",
    "kalshi_client.py",
    "research_client.py",
    "betting_models.py",
    "openai_utils.py",
    "src/",
]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.2.0",
]
